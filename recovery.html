<!-- Input Field -->

<label class="font-label-md text-label-md text-on-surface-variant" for="email">YOUR EMAIL</label>

                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span></button>
</form>

<div class="mt-stack-lg pt-stack-md border-t border-white/5 w-full text-center">

</main>
<!-- Global Footer (Suppressed Nav Shells as this is transactional) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = supabase.createClient('https://wiq8bv9jifkprhtgzqpiw.supabase.co', 'sb_publishable__WiQ8Bv9JIfKpRhtGzqpiw_okzDVCPg');

document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const button = e.target.querySelector('button');
    const originalText = button.innerHTML;

    button.disabled = true;
    button.innerText = 'SENDING...';

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password.html',
    });

    if (error) {
        alert('Error: ' + error.message);
        button.disabled = false;
        button.innerHTML = originalText;
    } else {
        button.innerText = 'LINK SENT!';
        alert('Check your email for the help link.');
    }
});
</script><footer class="absolute bottom-0 w-full py-stack-md px-gutter flex justify-center items-center">
