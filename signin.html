<style>
        /* Custom Utilities for Industrial Theme */
        .industrial-card {
            background-color: #131313;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 4px 4px 0px 0px #0E0E0F;
        }
        .industrial-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 140, 0, 0.15);
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
        }
        .industrial-input {
            background-color: #0E0E0F;
            border: none;
            border-bottom: 2px solid #2A2A2A;
            color: #e5e2e1;
        }
        .industrial-input:focus {
            outline: none;
            border-bottom-color: #FF8C00;
            box-shadow: 0 4px 15px -3px rgba(255, 140, 0, 0.2);
        }
        .industrial-btn-primary {
            background-color: #FF8C00;
            color: #000000;
            border-radius: 0;
            box-shadow: 4px 4px 0px 0px #0E0E0F;
            transition: all 0.1s ease;
        }
        .industrial-btn-primary:active, .industrial-btn-primary:hover {
            box-shadow: 0px 0px 0px 0px #0E0E0F;
            transform: translate(4px, 4px);
        }
        .scanline {
            width: 100%;
            height: 2px;
            background-color: rgba(255, 140, 0, 0.3);
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 4s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-gutter relative overflow-hidden">

<div class="absolute inset-0 bg-[url('placeholder')] bg-cover bg-center opacity-10" data-alt="A dark, rugged industrial texture resembling heavily weathered metal plates bolted together in a high-tech underground facility. Dim ambient lighting highlights deep scratches and robust rivets, creating a gritty, utilitarian atmosphere suitable for a heavy machinery command center. Deep charcoal and bronze tones dominate the palette."></div>
<div class="scanline"></div>
<!-- Main Container -->
<div class="relative w-full max-w-lg z-10">

<main class="industrial-card p-stack-lg relative overflow-hidden">
<!-- Header section with seal -->

<h1 class="font-headline-md text-headline-md text-primary text-center uppercase tracking-tighter">THE WORKERS GUILD</h1>

</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-unit block" for="affiliate-id">LOGIN EMAIL</label>
<input class="industrial-input w-full p-stack-sm font-label-md text-label-md placeholder:text-surface-variant" id="affiliate-id" name="affiliate-id" placeholder="ENTER CREDENTIALS" required="" type="text"/>
</div>
<div class="relative">
<label class="font-label-sm text-label-sm text-on-surface-variant mb-unit block" for="access-code">PASSWORD</label>
<input class="industrial-input w-full p-stack-sm font-label-md text-label-md placeholder:text-surface-variant" id="access-code" name="access-code" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center justify-between mt-unit mb-stack-md">
<label class="flex items-center gap-unit cursor-pointer">
<input class="form-checkbox h-4 w-4 bg-surface-container-low border-surface-variant text-primary focus:ring-0 rounded-none" type="checkbox"/>
<span class="font-label-sm text-label-sm text-on-surface-variant">SAVE_CREDENTIALS</span>
</label>
</div>
<button class="industrial-btn-primary w-full py-stack-md font-headline-sm text-headline-sm uppercase flex items-center justify-center gap-stack-sm" type="submit">
<span class="material-symbols-outlined">login</span>
                    LOGIN
                </button>

<span class="font-label-sm text-label-sm text-on-surface-variant">AUTH_NODE // 01</span>
</div>
</main>

<button class="bg-transparent border border-white/10 px-stack-md py-stack-sm font-label-md text-label-md text-on-surface hover:text-primary hover:border-primary/50 transition-colors uppercase w-full">CREATE ACCOUNT</button>
