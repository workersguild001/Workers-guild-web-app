<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary-container selection:text-black">
<!-- Background Elements -->
<div class="absolute inset-0 bg-diagonal-stripes"></div>
<!-- Orange Glow Focal Point -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container opacity-10 blur-[150px] rounded-full pointer-events-none"></div>
<!-- Login Container -->
<main class="relative z-20 w-full max-w-[480px] p-margin-mobile md:p-0">
<!-- Auth Node Label -->
<div class="bg-surface border-2 border-[#2a2a2a] p-stack-lg industrial-shadow relative">
<!-- Corner Accents -->
<div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-primary-container -mt-[2px] -ml-[2px]"></div>
<div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-primary-container -mt-[2px] -mr-[2px]"></div>
<div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-primary-container -mb-[2px] -ml-[2px]"></div>
<div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-primary-container -mb-[2px] -mr-[2px]"></div>
<!-- Header Section -->
<div class="flex flex-col items-center mb-stack-lg text-center">
<div class="w-32 h-32 mb-stack-md relative">
<div class="absolute inset-0 bg-primary-container blur-2xl opacity-20 rounded-full"></div>
<img alt="Official Guild Seal" class="w-full h-full object-contain relative z-10 drop-shadow-[0_0_15px_rgba(255,140,0,0.5)]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBJal6bvG97VyslrX5dotKUGoikdO9prVvCWVUzWHgQIweLJMsjZxfhHBnvJzIPsu2HB0fmLAh1t_aNYk77IvGj7jgSsl97SExgv-aR-D4IG61kYLeyTbnbJ7bif-VRQwwl8e6fGuc8jxEq3FE6LCMlnrwGF5AAmDLk-_NeRmVvcbJdZ7OCURgF5qwCXsksRLukhbaiDyrtGHbSBtx4HdNV9uDMfmHdKhpqGpWcOs1G9FMzCiJQGEGen1feECnkjn0YZmE"/>
</div>
<h1 class="font-headline-lg text-headline-lg uppercase italic tracking-tighter text-on-surface mb-unit">THE WORKERS GUILD</h1>
<h2 class="font-label-mono text-label-mono text-primary-container tracking-[0.2em]">SIGN IN</h2>
</div>
<!-- Horizontal Rule -->
<hr class="border-t-[1px] border-[#2a2a2a] mb-stack-lg w-full"/>
<!-- Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase" for="email">LOGIN EMAIL</label>
<input class="w-full bg-surface-container border-2 border-secondary-fixed text-on-surface font-label-mono p-3 focus:outline-none focus:border-primary-container focus:ring-0 focus:shadow-[0_0_10px_rgba(255,140,0,0.2)] transition-all uppercase placeholder:text-on-surface-variant/50" id="email" placeholder="ENTER CREDENTIALS" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-unit mb-stack-sm">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase" for="password">PASSWORD</label>
<input class="w-full bg-surface-container border-2 border-secondary-fixed text-on-surface font-label-mono p-3 focus:outline-none focus:border-primary-container focus:ring-0 focus:shadow-[0_0_10px_rgba(255,140,0,0.2)] transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Checkbox -->
<div class="flex items-center gap-2 mb-stack-md">
<input class="w-5 h-5 bg-surface-container border-2 border-secondary-fixed text-primary-container focus:ring-0 focus:ring-offset-0 rounded-none cursor-pointer" id="save_creds" type="checkbox"/>
<label class="font-label-mono text-label-mono text-on-surface-variant cursor-pointer uppercase mt-1" for="save_creds">REMEMBER ME</label>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-black font-headline-md text-body-lg uppercase py-4 border-2 border-black flex items-center justify-center gap-2 industrial-shadow transition-all font-bold tracking-wider mb-stack-md group" type="submit"><span class="material-symbols-outlined text-[24px] group-hover:translate-x-1 transition-transform" data-icon="login" data-weight="fill">login</span> SIGN IN</button>
</form>
<!-- Secondary Actions -->
<div class="flex flex-col gap-stack-sm mt-stack-md">
<a class="w-full bg-transparent text-on-surface font-label-mono text-label-mono uppercase py-3 border-2 border-[#2a2a2a] hover:border-primary-container hover:text-primary-container transition-colors tracking-widest text-center block" href="signup.html">CREATE ACCOUNT</a>
<a class="text-center font-label-mono text-label-mono text-on-surface-variant hover:text-primary-container underline underline-offset-4 mt-unit transition-colors" href="#">
                    LOST OR STOLEN ACCOUNT?
                </a>
</div>
<!-- Caution Bar Decor -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-[repeating-linear-gradient(45deg,#ff8c00,#ff8c00_10px,#000_10px,#000_20px)]"></div>
</div>
