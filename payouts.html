<!DOCTYPE html>

        body { font-family: 'Hanken Grotesk', sans-serif; }

            background-position: center;
            background-blend-mode: overlay;
        }
        .glass-panel {
            background: rgba(28, 27, 27, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);

<body class="bg-[#0e0e0e] text-[#ff8c00] min-h-screen blueprint-bg" style="background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLsd2xkzu59ZzYobY_Ng0PGVPurk_pOtkiL8_nLj1jz3JXo7TC0-lL7vjahTgU20X5R7ttVb35pr4RCr9PB-HirXa9VQFmrMOF_wHdRP1SyX_sF33F9A6bu5IeXkAQdYcENJZAW6VA4ak7Iv4EGBIhEqqilU3OnsHqgy7igQzlPWdp0JbWNibbKDqjg3Iy1yHTSVUsUtCYlkjdSstEE_qd3LYMqZvzVIANFCP0B8mSDCCjPbTl86f1pRelg');">
<!-- Header -->
<header class="p-6 flex justify-between items-center bg-[#131313]/90 border-b border-white/5 sticky top-0 z-50">
<div class="flex items-center gap-4">
<h1 class="text-xl font-black tracking-tighter uppercase">Payout Terminal</h1>
</div>
<div class="text-[10px] font-bold opacity-60 text-right">
            VERSION 0.1<br/>
            SYSTEM ONLINE
        </div>
</header>
<main class="max-w-2xl mx-auto p-6 pt-12 space-y-8">
<!-- Logo Section -->
<div class="flex justify-center mb-12 relative">
<div class="absolute inset-0 bg-[#ff8c00] rounded-full blur-[80px] opacity-20 transform scale-75" style="aspect-ratio: 1/1; border-radius: 50%; box-shadow: 0 0 100px 40px rgba(255, 140, 0, 0.4);"></div>
<img alt="Guild Seal" class="w-48 h-48 glow-orange relative z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWw4wws98hLncnd7irDUdImzEzO6KunI2ENEvUy9JQWY2KPGXNa8YmrwGhDK9P3JAYVWjiMx5P9XuUR0CFcGl01bJ5sjQnaaXvIExGgM5KrPyJR2jC7Wbd_bGosfmZ1_ZP3QLacbMR5cG_n0HloyvUNIW-3E6BG9sIUaT-PMnMMNO1Si5Pk2jxI1OVS8FT2_dTH8J9P0cT5OlyG2LW2el10SHlc1w-A91XlJBet1bFUQ47eYY57Bjg-o1_i9JOgnZfAw"/>
</div>
<!-- Main Payout Card -->
<div class="glass-panel p-8 md:p-12 rounded-lg text-center shadow-2xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-[#ff8c00]/30"></div>
<h3 class="text-xs font-black uppercase tracking-[0.2em] opacity-70 mb-4">Available for Cash Out</h3>
<div class="text-7xl font-black tracking-tighter mb-10">$0.00</div>
<!-- Status Box -->
<div class="p-8 border-2 border-dashed border-white/10 rounded-lg mb-10 bg-black/20">
<h4 class="text-2xl font-black uppercase opacity-40 tracking-tight">No Funds Available</h4>
<p class="text-[10px] uppercase tracking-widest opacity-60 mt-2">Next Update: August 16, 2026</p>
</div>
<!-- PayPal Connection -->
<div class="space-y-4">
<div class="flex justify-between items-center bg-black/60 p-5 rounded border border-[#ff8c00]/20">
<div class="text-left">
<div class="text-[9px] font-black uppercase opacity-60">Payment Method</div>
<span class="font-black tracking-tight">PayPal</span>
</div>
<span class="text-sm font-bold opacity-90 underline decoration-[#ff8c00]/50 underline-offset-4 tracking-tight" id="paypal-email-display">user@example.com</span>
</div>
</div>
<!-- Simplified Withdraw Button -->
<button class="w-full mt-8 bg-white/5 border border-white/10 text-white/40 font-black uppercase py-4 rounded cursor-not-allowed text-sm tracking-[0.1em]">WITHDRAW FUNDS</button>
</div>
<!-- System Log -->
<div class="text-center">
<p class="text-[10px] font-bold uppercase tracking-widest opacity-50">SECURE TRANSACTIONS. ALL ACTIVITY IS RECORDED.</p>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto p-12 text-center border-t border-white/5 bg-[#0e0e0e]">
<p class="text-[10px] font-bold uppercase tracking-widest opacity-60">VERSION 0.1 // 2026 // BUILT BY WORKERS. FOR WORKERS.</p>
</footer>
