<body class="bg-background min-h-screen flex items-center justify-center p-gutter relative overflow-hidden text-on-surface selection:bg-primary-container selection:text-on-primary-container">

<!-- Main Registration Module -->
<main class="w-full max-w-md z-10 relative">
<!-- Registration Card -->

<!-- Technical Overlay Pattern -->

<!-- Header Section -->

<span class="font-label-sm text-label-sm text-on-surface-variant absolute top-0 left-0 tracking-widest">UNIT_01 // INIT</span>
<div class="w-24 h-24 mb-stack-md rounded-full overflow-hidden border-2 border-surface-container-high bg-surface-container-lowest flex items-center justify-center focal-glow" style="box-shadow: 0 0 30px 5px #ff8c00;">
<img alt="The Workers Guild Bronze Seal" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDS8O3Tei_RzNg47lSYnGtN9QXd1TsfaaO3twcH_Sq8mxMlqyucjuQxL6qYNPwYX7J0jdlDmb1vXRNr8jApxN-FMzXNNH_14NkH0kmLrUjpvDnRQQ2zK8PCsFtgQf-14UNBrqW0_B9J6i4vtMx_-DO3rqAmxMlluVA53T-8_TyQKlO5OKuoQNGWEZM-LTUb65hvaPre2mzjLg-CI2_XqSAxh5MaB07nlboRzf8GuX9rUw5Y3DkykZj_ZpucNM9QK9i3Dw"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tighter uppercase">Sign Up</h1>
<p class="font-label-md text-label-md text-on-surface-variant mt-unit text-center">INITIALIZE GUILD CREDENTIALS</p>
</header>
<!-- Registration Form -->
<form action="recruitment.html" class="flex flex-col gap-stack-md relative z-10" method="POST">
<!-- Full Name Field -->
<div class="group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit uppercase tracking-widest" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px]">badge</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-surface-container-high text-on-surface font-label-md text-label-md px-3 py-3 pl-10 focus:ring-0 focus:border-primary input-glow transition-all placeholder:text-on-surface-variant/50" id="fullName" name="fullName" placeholder="JOHN DOE" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="group">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit uppercase tracking-widest" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-surface-container-high text-on-surface font-label-md text-label-md px-3 py-3 pl-10 focus:ring-0 focus:border-primary input-glow transition-all placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="WORKER@GUILD.COM" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="group mb-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit uppercase tracking-widest" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px]">key</span>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-surface-container-high text-on-surface font-label-md text-label-md px-3 py-3 pl-10 focus:ring-0 focus:border-primary input-glow transition-all placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>

<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest cursor-pointer select-none" for="tosCheckbox">
        I acknowledge the <a class="text-primary hover:text-primary-fixed underline decoration-primary/30 underline-offset-4" href="#" id="openModalBtn">Guild Conditions</a>
</label>

                    Create Account
                    <span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
</button>

<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">arrow_left</span>
                    BACK TO SIGN IN
                </a>
<p class="font-label-sm text-label-sm text-on-surface-variant/50 text-center uppercase tracking-widest">Built by workers. For workers. 2026</p>
</footer>

<!-- TOS Modal -->
<div class="fixed inset-0 z-50 hidden items-center justify-center bg-background/90 backdrop-blur-sm p-gutter" id="tosModal">
<div class="w-full max-w-3xl max-h-[80vh] flex flex-col bg-surface-dim border border-primary/20 shadow-[0_0_40px_rgba(255,140,0,0.15)] relative overflow-hidden industrial-shadow">
<!-- Modal Header -->
<header class="p-4 border-b border-white/5 bg-surface-container-highest flex justify-between items-center relative z-10">
<h2 class="font-headline-sm text-headline-sm text-primary uppercase tracking-tighter">Guild Conditions</h2>
<button class="text-on-surface-variant hover:text-primary transition-colors" id="closeModalBtn" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Modal Content -->
<div class="p-gutter overflow-y-auto font-body-md text-on-surface-variant relative z-10 custom-scrollbar prose prose-invert prose-headings:text-on-surface prose-headings:font-headline-sm prose-a:text-primary max-w-none">
            {{DATA:DOCUMENT:DOCUMENT_6}}
        </div>
<!-- Modal Footer -->
<footer class="p-4 border-t border-white/5 bg-surface-container-highest flex justify-end relative z-10">
<button class="bg-primary-container text-[#0E0E0F] font-bold px-6 py-2 uppercase tracking-wide hover:brightness-110 transition-all shadow-[4px_4px_0px_0px_#0E0E0F] hover:shadow-none hover:translate-x-[4px] hover:translate-y-[4px]" id="acceptBtn" type="button">Accept Conditions</button>
</footer>
</div>
</div>
<script>
        // Simple script to toggle password visibility
        const passwordInput = document.getElementById('password');
        const toggleBtn = passwordInput.nextElementSibling;
        const toggleIcon = toggleBtn.querySelector('.material-symbols-outlined');

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        // TOS Checkbox Logic
        const tosCheckbox = document.getElementById('tosCheckbox');
        const submitBtn = document.getElementById('submitBtn');

        tosCheckbox.addEventListener('change', (e) => {
            submitBtn.disabled = !e.target.checked;
            if (e.target.checked) {
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.classList.add('industrial-shadow-hover');
            } else {
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                submitBtn.classList.remove('industrial-shadow-hover');
            }
        });

        // Modal Logic
        const modal = document.getElementById('tosModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const acceptBtn = document.getElementById('acceptBtn');

        openBtn.addEventListener('click', (e) => {
            e.preventDefault();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        const closeModal = () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        closeBtn.addEventListener('click', closeModal);
        
        acceptBtn.addEventListener('click', () => {
            tosCheckbox.checked = true;
            tosCheckbox.dispatchEvent(new Event('change'));
            closeModal();
        });
        
        // Close modal when clicking outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body></html>
