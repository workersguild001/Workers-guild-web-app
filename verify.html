      background-attachment: fixed;

<body class="bg-blueprint text-gray-300 min-h-screen flex flex-col items-center justify-center p-4">
<!-- BEGIN: MainContent -->
<main class="content-wrapper w-full max-w-md flex flex-col items-center gap-6">
<!-- BEGIN: GuildSeal -->
<div class="relative w-32 h-32 md:w-40 md:h-40 rounded-full shadow-glow-orange flex items-center justify-center bg-guild-dark border-4 border-guild-bronze overflow-hidden">
<img alt="The Workers Guild Seal" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMHVxzEvd51koNOmtyOqUK4cVZ6oMeXvFIiCV2PGu_0bBZYJQmQLQZ-z46lBetO2R5262okIrpy8pWmHm_-OJBbLWz0CeEiOiu8UNvnxauoPCpwHIFu0cG2XZS_XboxJM0RBpR-6ilfcuxnFCg3k0u2gNuf5DMzr0tO3hAkZZzaMMNTM6jRos7FANaS9wJ-uojmAlmtGMTPlHIjMGmo_JnBmRF6dIbQ1HrKcKDHrsCifS1RGciauumRs6Jy9RXmhp6PQ"/>
</div>
<!-- END: GuildSeal -->
<!-- BEGIN: VerificationCard -->
<section class="w-full bg-guild-dark/90 border-2 border-guild-bronze rounded-lg p-6 shadow-xl flex flex-col gap-6 backdrop-blur-sm">
<!-- Status Header -->
<header class="text-center border-b border-guild-bronze/50 pb-4 flex flex-col items-center gap-2">
<div class="flex items-center gap-2 font-bold text-xl uppercase tracking-wider text-gray-400 blink" id="verification-status">

          INITIALIZING...
        </div>
</header>
<!-- Profile Details -->
<article class="flex flex-col gap-4 text-center">
<div>
<h2 class="text-sm text-guild-bronze uppercase tracking-widest mb-1">Name</h2>
<p class="text-2xl font-bold text-white uppercase" id="profile-name">--</p>
</div>
<div>
<h2 class="text-sm text-guild-bronze uppercase tracking-widest mb-1">Trade</h2>
<p class="text-xl text-gray-200 uppercase" id="profile-trade">--</p>
</div>
<div>
<h2 class="text-sm text-guild-bronze uppercase tracking-widest mb-1">Guild ID</h2>
<p class="text-lg text-guild-orange font-bold uppercase" id="profile-id">--</p>
</div>
</article>
<!-- Experience Section -->
<div class="flex flex-col gap-2">
<div class="flex justify-between text-sm text-guild-bronze uppercase tracking-wider">

<span>LEVEL --</span>
</div>
<div class="w-full bg-gray-800 rounded-full h-3 border border-guild-bronze/30 overflow-hidden">
<div class="bg-guild-orange h-3 rounded-full" style="width: 0%"></div>
</div>
</div>
<!-- Skills Tags -->
<div class="flex flex-col gap-2">
<h3 class="text-sm text-guild-bronze uppercase tracking-widest text-center">Certified Skills</h3>
<div class="flex flex-wrap justify-center gap-2" id="skills-container"></div>
</div>
<!-- Footer Info -->
<footer class="mt-4 pt-4 border-t border-guild-bronze/30 text-center text-xs text-gray-500 leading-relaxed">
<p id="verification-msg">Authenticating credentials...</p>
<p>Credentials are encrypted and immutable.</p>
</footer>
</section>
<!-- END: VerificationCard -->
<!-- BEGIN: Navigation -->
<a class="px-6 py-3 bg-transparent border-2 border-guild-orange text-guild-orange font-bold uppercase tracking-wider hover:bg-guild-orange hover:text-guild-dark transition-colors duration-300 rounded focus:outline-none focus:ring-2 focus:ring-guild-orange focus:ring-offset-2 focus:ring-offset-guild-dark" href="https://workersguild.store">
      Return to Terminal
    </a>
<!-- END: Navigation -->
</main>
<!-- END: MainContent -->
<script data-purpose="dynamic-profile-data">
    // Mock Supabase Setup - Replace with actual credentials if available
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const workerId = urlParams.get('id');
      const jobId = urlParams.get('job');
      
      const statusElement = document.getElementById('verification-status');
      const idElement = document.getElementById('profile-id');
      const nameElement = document.getElementById('profile-name');
      const tradeElement = document.getElementById('profile-trade');
      const msgElement = document.getElementById('verification-msg');

      // Update Basic Info immediately
      if (workerId) {
        idElement.textContent = `WG-${workerId.toUpperCase()}`;
        // Basic mock data based on ID for visual completeness during init
        if (workerId.toLowerCase() === 'smith') {
          nameElement.textContent = 'Robert Smith';
          tradeElement.textContent = 'Master Blacksmith';
        } else if (workerId.toLowerCase() === 'miller') {
          nameElement.textContent = 'Sarah Miller';
          tradeElement.textContent = 'Journeyman Electrician';
        } else {
          nameElement.textContent = 'John Doe';
          tradeElement.textContent = 'Master Carpenter';
        }
      } else {
         idElement.textContent = `WG-UNKNOWN`;
         nameElement.textContent = 'UNKNOWN';
         tradeElement.textContent = 'UNKNOWN';
      }

      // Verification Protocol Simulation
      setTimeout(async () => {
        try {
           if (!workerId) {
             setUnverifiedState("NO GUILD ID PROVIDED");
             return;
           }

           if (!jobId) {
             setPendingState("CRAFTSMAN IDENTITY PENDING JOB CONTEXT");
             return;
           }

           // Simulate Supabase Query
           // In real implementation:
           // const { data, error } = await supabase.from('applications').select('*').eq('worker_id', workerId).eq('job_id', jobId).eq('status', 'ACCEPTED').single();
           
           // Mocking the result:
           const isVerified = (workerId && jobId && jobId !== 'invalid'); 

           if (isVerified) {
             setVerifiedState();
           } else {
             setUnverifiedState("JOB ASSIGNMENT NOT AUTHORIZED");
           }

        } catch (error) {
           console.error("Verification Error", error);
           setUnverifiedState("VERIFICATION ERROR");
        }
      }, 1500); // 1.5s simulated loading

      function setVerifiedState() {
        statusElement.className = "flex items-center gap-2 text-guild-green font-bold text-xl uppercase tracking-wider";
        statusElement.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
          Craftsman Verified
        `;
        msgElement.textContent = "This craftsman is a verified member of The Workers Guild and authorized for this assignment.";
      }

      function setUnverifiedState(msg) {
        statusElement.className = "flex items-center gap-2 text-guild-red font-bold text-xl uppercase tracking-wider";
        statusElement.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          UNVERIFIED
        `;
        msgElement.textContent = msg;
      }

      function setPendingState(msg) {
         statusElement.className = "flex items-center gap-2 text-guild-orange font-bold text-xl uppercase tracking-wider";
         statusElement.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          PENDING VERIFICATION
        `;
        msgElement.textContent = msg;
      }
    });
  </script>
</body></html>
