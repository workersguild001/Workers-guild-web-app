<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Craftsman Verified | THE WORKERS GUILD</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ff8c00',
                        surface: '#131313',
                        'surface-container': '#1c1b1b',
                    },
                    fontFamily: {
                        sans: ['Hanken Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0e0e0e;
            background-image: 
                linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #e4e2e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .terminal-container {
            width: 100%;
            max-width: 500px;
            background: #131313;
            border: 1px solid #ff8c00;
            padding: 32px;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        .guild-seal {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.4));
        }

        .verified-badge {
            color: #00ff88;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 140, 0, 0.2);
            padding-bottom: 16px;
        }

        .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #8e9192;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .xp-bar-container {
            width: 100%;
            height: 8px;
            background: #1c1b1b;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .xp-bar-fill {
            height: 100%;
            background: #ff8c00;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        .skill-tag {
            border: 1px solid #ff8c00;
            padding: 4px 12px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .return-btn {
            margin-top: 32px;
            width: 100%;
            border: 1px solid #ff8c00;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            cursor: pointer;
            text-align: center;
            display: block;
        }

        .return-btn:hover {
            background: #ff8c00;
            color: #131313;
        }
    </style>
</head>
<body>

    <img src="{{DATA:IMAGE:IMAGE_6}}" alt="Guild Seal" class="guild-seal">

    <div class="terminal-container">
        <div class="verified-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Craftsman Verified
        </div>

        <div class="text-center">
            <p class="label">Name</p>
            <p class="data-value" id="worker-name">John Doe</p>

            <p class="label">Trade</p>
            <p class="data-value" id="worker-trade" style="font-size: 18px; color: #ff8c00;">Master Carpenter</p>

            <p class="label">Guild ID</p>
            <p class="data-value" id="worker-id" style="font-size: 16px; color: #ff8c00;">WG-XXXX-XXXX</p>

            <div class="flex justify-between items-center mb-1">
                <p class="label">Experience Points</p>
                <p class="label">Level 42</p>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar-fill" style="width: 75%;"></div>
            </div>

            <p class="label mb-4">Certified Skills</p>
            <div class="flex flex-wrap justify-center">
                <span class="skill-tag">Carpentry</span>
                <span class="skill-tag">Framing</span>
                <span class="skill-tag">OSHA Safety</span>
                <span class="skill-tag">Blueprint Reading</span>
            </div>

            <div class="mt-8 pt-8 border-t border-white/5 opacity-40 text-[10px] uppercase font-mono">
                This craftsman is a verified member of The Workers Guild.
                <br>Credentials are encrypted and immutable.
            </div>
        </div>
    </div>

    <button onclick="window.location.href='index.html'" class="return-btn max-w-[500px]">
        Return to Terminal
    </button>

    <script>
        // Fetches profile data based on ID in URL (e.g., verify.html?id=WG-1234)
        async function loadVerifiedProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('id');
            
            if (profileId) {
                console.log("Loading public verification data for: " + profileId);
                // Supabase fetch logic for public data goes here
            }
        }
        loadVerifiedProfile();
    </script>
</body>
</html>
