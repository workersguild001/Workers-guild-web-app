<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Work Orders | THE WORKERS GUILD</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ff8c00',
                        surface: '#131313',
                        'surface-container': '#1c1b1b',
                    },
                    fontFamily: {
                        sans: ['Hanken Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0e0e0e;
            background-image: 
                linear-gradient(rgba(255, 140, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 140, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #e4e2e1;
            min-height: 100vh;
        }
        .glow-active {
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.2);
            border-color: #ff8c00 !important;
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.2);
            border-color: #ff8c00;
        }
        .scroll-industrial::-webkit-scrollbar {
            width: 4px;
        }
        .scroll-industrial::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        .scroll-industrial::-webkit-scrollbar-thumb {
            background: #ff8c00;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen overflow-x-hidden">

    <!-- Mobile Header -->
    <header class="md:hidden w-full p-4 bg-surface border-b border-white/5 flex justify-between items-center z-50">
        <span class="text-primary font-black tracking-tighter text-xl uppercase italic">The Guild</span>
        <button id="mobile-menu-toggle" class="text-primary">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <!-- Side Navigation -->
    <aside id="side-nav" class="fixed inset-y-0 left-0 w-64 bg-surface border-r border-white/5 flex flex-col p-6 z-[60] -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="mb-12 hidden md:block">
            <h1 class="text-primary font-black tracking-tighter text-2xl italic uppercase">The Guild</h1>
        </div>

        <div class="flex items-center gap-3 p-4 bg-white/5 border border-white/10 mb-8">
            <div class="w-10 h-10 bg-primary/20 flex items-center justify-center border border-primary/40">
                <svg width="20" height="20" fill="none" stroke="#ff8c00" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div>
                <p class="text-[10px] font-mono text-primary uppercase tracking-widest">Master Rank</p>
                <p class="text-[11px] font-mono opacity-60 uppercase" id="user-location">Location: --</p>
            </div>
        </div>
        
        <nav class="space-y-2 flex-1">
            <a href="matrix.html" class="flex items-center gap-3 p-3 hover:bg-white/5 transition-colors font-bold opacity-60">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                STATS
            </a>
            <a href="recruitment.html" class="flex items-center gap-3 p-3 hover:bg-white/5 transition-colors font-bold opacity-60">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                GUILD PASS
            </a>
            <a href="jobs.html" class="flex items-center gap-3 p-3 bg-primary text-surface font-bold glow-active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                JOBS
            </a>
            <a href="profile.html" class="flex items-center gap-3 p-3 hover:bg-white/5 transition-colors font-bold opacity-60">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                PROFILE
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5 space-y-4">
            <button onclick="signOut()" class="w-full flex items-center gap-3 p-3 hover:text-primary transition-colors font-mono text-[10px] uppercase tracking-widest opacity-60 hover:opacity-100">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                LOGOUT
            </button>
            <p class="text-[9px] font-mono opacity-30 uppercase">v0.1 // 2026</p>
        </div>
    </aside>

    <!-- Overlay for mobile menu -->
    <div id="nav-overlay" class="fixed inset-0 bg-black/80 z-[55] hidden md:hidden"></div>

    <!-- Main Content -->
    <main class="flex-1 p-6 md:p-12 md:ml-64">
        <header class="mb-12">
            <h2 class="text-5xl md:text-6xl font-black uppercase tracking-tighter italic border-l-4 border-primary pl-6">Work Orders</h2>
            <p class="text-sm opacity-60 mt-4 max-w-2xl">Available contracts in your sector. Earn a baseline of 120 XP/HR + Craftsman Level bonuses on all active work orders.</p>
        </header>

        <!-- Control Bar -->
        <div class="flex flex-col lg:flex-row gap-4 mb-8 bg-surface p-4 border border-white/5">
            <div class="flex-1 relative">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 opacity-30" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="job-search" placeholder="SEARCH TRADES (E.G., WELDING)..." class="w-full bg-black/40 border border-white/10 p-4 pl-12 text-xs font-bold tracking-widest uppercase focus:outline-none input-glow transition-all">
            </div>
            
            <div class="flex gap-4">
                <select id="location-filter" class="bg-black/40 border border-white/10 p-4 text-xs font-bold tracking-widest uppercase focus:outline-none input-glow transition-all appearance-none pr-10 relative">
                    <option value="">All Locations</option>
                    <option value="remote">Remote</option>
                    <option value="tx">Texas (TX)</option>
                    <option value="ca">California (CA)</option>
                </select>
                
                <button id="refine-toggle" class="bg-white/5 border border-white/10 px-8 py-4 text-xs font-bold tracking-widest uppercase hover:bg-primary hover:text-surface transition-all flex items-center gap-2">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
                    Refine
                </button>
            </div>
        </div>

        <!-- Refinement Menu (Hidden by default) -->
        <div id="refinement-menu" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3 mb-8 p-6 bg-surface-container border border-primary/20 animate-in fade-in slide-in-from-top-4 duration-300">
            <!-- Populated via script for the 14 skills -->
        </div>

        <!-- Jobs Grid/List -->
        <div id="jobs-container" class="space-y-4">
            <div class="text-center py-24 border border-dashed border-white/10 opacity-40">
                <div class="inline-block animate-spin mb-4">
                    <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <p class="font-mono text-xs uppercase tracking-[0.2em]">Awaiting Uplink... Synchronizing Work Orders</p>
            </div>
        </div>
    </main>

    <script>
        // SUPABASE CONFIG (Placeholder - Replace with your localized credentials)
        const SUPABASE_URL = 'https://your-project.supabase.co';
        const SUPABASE_KEY = 'your-anon-key';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // UI Logic
        const refineToggle = document.getElementById('refine-toggle');
        const refineMenu = document.getElementById('refinement-menu');
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const sideNav = document.getElementById('side-nav');
        const navOverlay = document.getElementById('nav-overlay');

        refineToggle.addEventListener('click', () => {
            refineMenu.classList.toggle('hidden');
        });

        mobileMenuToggle.addEventListener('click', () => {
            sideNav.classList.remove('-translate-x-full');
            navOverlay.classList.remove('hidden');
        });

        navOverlay.addEventListener('click', () => {
            sideNav.classList.add('-translate-x-full');
            navOverlay.classList.add('hidden');
        });

        // Initialize Skill Filters (14 Trade Matrix)
        const trades = [
            "Carpentry", "Welding", "Stonemasonry", "Gen. Labor", 
            "Commercial Driving", "Farming", "Plumbing", "Roofing", 
            "Engineering", "Electrician", "HV/AC", "Mechanics", 
            "Metalworking", "Landscaping"
        ];

        function initFilters() {
            refineMenu.innerHTML = trades.map(trade => `
                <label class="flex items-center gap-3 p-3 border border-white/5 hover:border-primary/40 cursor-pointer transition-colors group">
                    <input type="checkbox" class="hidden peer" value="${trade.toLowerCase()}">
                    <div class="w-4 h-4 border border-white/20 peer-checked:bg-primary peer-checked:border-primary transition-all"></div>
                    <span class="text-[10px] font-bold uppercase tracking-widest opacity-60 peer-checked:opacity-100">${trade}</span>
                </label>
            `).join('');
        }

        async function fetchJobs() {
            // Real Supabase Fetch Logic
            // const { data, error } = await supabase.from('jobs').select('*').eq('status', 'OPEN');
            
            // For now, keeping the terminal ready for your push
            console.log("Terminal Ready: Fetching jobs.html logistics...");
        }

        async function signOut() {
            // await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        initFilters();
        fetchJobs();
    </script>
</body>
</html>
