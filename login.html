</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-mono text-xs text-orange-guild uppercase tracking-wider" for="password">SEC_KEY (PASSWORD)</label>
</div>
<input class="input-industrial w-full px-4 py-3 rounded-none font-mono text-sm tracking-widest placeholder-slate-500 text-white" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded-none border-slate-600 bg-slate-800 text-orange-guild focus:ring-orange-guild focus:ring-offset-slate-900" id="remember-me" name="remember-me" type="checkbox"/>

<div class="text-xs font-mono text-slate-500">

          </div>
</div>
<!-- Submit Button -->
<div>
<button class="btn-primary w-full py-3 px-4 font-mono text-sm tracking-[0.1em] mt-2 flex justify-center items-center gap-2" type="submit">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg>
