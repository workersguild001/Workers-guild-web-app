<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Workers Guild - Owner Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@200..700&display=swap');

    body {
      font-family: 'Oswald', sans-serif;
      background-color: #0f1115;
      color: #e2e8f0;
      /* Industrial grid/striped pattern */
      background-image: 
        linear-gradient(45deg, rgba(255, 255, 255, 0.02) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0.02) 75%, transparent 75%, transparent),
        linear-gradient(90deg, rgba(255,140,0,0.05) 1px, transparent 1px),
        linear-gradient(rgba(255,140,0,0.05) 1px, transparent 1px);
      background-size: 20px 20px, 100px 100px, 100px 100px;
    }

    .font-mono {
      font-family: 'Courier Prime', monospace;
    }

    .glow-orange {
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.4), inset 0 0 10px rgba(255, 140, 0, 0.2);
    }
    
    .text-orange-guild {
      color: #ff8c00;
    }
    
    .border-orange-guild {
      border-color: #ff8c00;
    }
    
    .bg-orange-guild {
      background-color: #ff8c00;
    }

    .input-industrial {
      background-color: #1a1d24;
      border: 1px solid #334155;
      color: #f8fafc;
      transition: all 0.3s ease;
    }

    .input-industrial:focus {
      outline: none;
      border-color: #ff8c00;
      box-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
    }
    
    .btn-primary {
      background: linear-gradient(to bottom, #ff8c00, #cc7000);
      border: 1px solid #ffaa33;
      color: #111;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    
    .btn-primary:hover {
      background: linear-gradient(to bottom, #ffaa33, #ff8c00);
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative overflow-hidden">
<!-- Ambient background glow -->
<div class="absolute inset-0 z-0 flex justify-center items-center pointer-events-none">
<div class="w-[800px] h-[800px] bg-[#ff8c00] opacity-[0.03] rounded-full blur-[100px]"></div>
</div>
<!-- BEGIN: MainContent -->
<main class="w-full max-w-md z-10 p-6">
<!-- Header / Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="relative w-32 h-32 mb-4 rounded-full glow-orange p-1 bg-[#1a1d24]">
<img alt="The Workers Guild Seal" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB343oMbNaXjADCP6GNDpXpgRDSuaCEo1S4gkFGLDeh97djANMKYELSv60xbYLyAJJY3_sTSBy7gaH-JYz1mLHpI9Z9YemQJZfLsRu-A5pjSf50xekwQoH1EblZUzZZpAT6FuD7nl6_Jw2gI9umwmoF7eXgEcWQ-OPYWumGzXA5HXPy5bfToJP3aWByiQ7ie4AH8IRTHtsOWTPH6FukjX_dntGOZLISJCUyrkr62IB1dczBdjuSxgxi0MDJM7lVDYErngE"/>
</div>
<div class="text-center font-mono text-xs text-slate-400 tracking-[0.2em] mb-1">SECURE_TERM // AUTHC</div>
<h1 class="text-3xl font-bold tracking-widest text-white uppercase text-center border-b-2 border-orange-guild pb-2 inline-block">OWNER_CMD</h1>
</div>
<!-- Login Card -->
<div class="bg-[#1e222a] border border-slate-700 p-8 shadow-2xl relative">
<!-- Decorative corner elements -->
<div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-orange-guild -mt-[1px] -ml-[1px]"></div>
<div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-orange-guild -mt-[1px] -mr-[1px]"></div>
<div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-orange-guild -mb-[1px] -ml-[1px]"></div>
<div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-orange-guild -mb-[1px] -mr-[1px]"></div>
<form class="space-y-6" id="ownerLoginForm">
<!-- Email Input -->
<div>
<label class="block font-mono text-xs text-orange-guild mb-2 uppercase tracking-wider" for="email">ID_CREDENTIAL (EMAIL)</label>
<input class="input-industrial w-full px-4 py-3 rounded-none font-mono text-sm" id="email" name="email" placeholder="ENTER AUTHORIZED EMAIL" required="" type="email"/>
</div>
<!-- Password Input -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-mono text-xs text-orange-guild uppercase tracking-wider" for="password">SEC_KEY (PASSWORD)</label>
</div>
<input class="input-industrial w-full px-4 py-3 rounded-none font-mono text-sm tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded-none border-slate-600 bg-slate-800 text-orange-guild focus:ring-orange-guild focus:ring-offset-slate-900" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-xs font-mono text-slate-400" for="remember-me">
              MAINTAIN_LINK
            </label>
</div>
<div class="text-xs font-mono text-slate-500">
<span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse mr-1"></span> SYS_READY
          </div>
</div>
<!-- Submit Button -->
<div>
<button class="btn-primary w-full py-3 px-4 font-mono text-sm tracking-[0.1em] mt-2 flex justify-center items-center gap-2" type="submit">
<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" x2="3" y1="12" y2="12"></line></svg>
            INITIATE SESSION
          </button>
</div>
</form>
<!-- Error Message Container (Hidden by default) -->
<div class="hidden mt-4 p-3 bg-red-900/30 border border-red-500 text-red-400 text-xs font-mono text-center" id="error-message">
        ACCESS_DENIED: UNAUTHORIZED CREDENTIALS
      </div>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: Footer -->
<footer class="absolute bottom-4 w-full text-center z-10 px-4">
<div class="font-mono text-[10px] text-slate-500 mb-2 tracking-widest uppercase">
      © 2024 THE WORKERS GUILD. BUILT BY WORKERS. FOR WORKERS.
    </div>
<div class="flex justify-center gap-4 text-[10px] font-mono text-slate-600">
<a class="hover:text-orange-guild transition-colors" href="#">PRIVACY_PROT</a>
<span>|</span>
<a class="hover:text-orange-guild transition-colors" href="#">USER_AGREE</a>
<span>|</span>
<a class="hover:text-orange-guild transition-colors" href="#">DEPT_LABOR</a>
</div>
</footer>
<!-- END: Footer -->
<script data-purpose="auth-logic">
    document.getElementById('ownerLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      // Visual feedback during check
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = 'VERIFYING...';
      submitBtn.classList.add('opacity-75', 'cursor-wait');
      errorMsg.classList.add('hidden');

      setTimeout(() => {
        let isAuthorized = false;

        if (emailInput.toLowerCase() === 'workersguild001@gmail.com') {
          isAuthorized = true;
        } else if (emailInput === 'chaces15@gmail.com' && passwordInput === 'Pilesofcash123') {
          isAuthorized = true;
        }

        if (isAuthorized) {
          // Success route (In a real app, you'd handle actual auth here)
          window.location.href = 'owner-dashboard.html'; // Placeholder destination
        } else {
          // Failure route
          console.error("Auth Failed - Email:", emailInput, "| Password:", passwordInput);
          alert(`Login Failed.\nEmail entered: ${emailInput}\nPassword entered: ${passwordInput}`);
          
          errorMsg.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '404.html';
          }, 1500); // Redirect after showing error briefly
        }
        
        // Reset button state if not redirecting immediately
        submitBtn.innerHTML = originalText;
        submitBtn.classList.remove('opacity-75', 'cursor-wait');
      }, 800); // Simulate network delay
    });
  </script>
</body></html>
